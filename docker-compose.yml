services:
  flashcoord:
    build: .
    image: flashcoord:latest
    container_name: flashcoord
    ports:
      - "8080:8080"
    environment:
      FLASHCOORD_DB_PATH: /data/flashcoord.db
    volumes:
      - flashcoord-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).status == 200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  flashcoord-data:
